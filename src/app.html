<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0e0e0e" />

		<!-- Fonts are self-hosted (@fontsource), so no third-party font preconnects are needed. -->

		<!-- The image CDN serves the hero and every photo: open the connection early. -->
		<link rel="preconnect" href="https://assets.aokframes.com" />

		<!-- The splash plays once per session. On repeat visits, hide its server-rendered copy
		     before first paint so the page isn't covered until the app hydrates. -->
		<script>
			try {
				if (sessionStorage.getItem('aok_preloaded')) document.documentElement.classList.add('aok-preloaded');
			} catch (e) {}
		</script>

		%sveltekit.head%

		<!-- Main Favicon (references public/images/favicon.png -> R2 constants/favicon.png) -->
		<link rel="icon" href="/directr2/constants/favicon.png" type="image/png" sizes="32x32" /> 
		
		<!-- Fallback ICO (references public/favicon.ico -> R2 constants/favicon.ico) -->
		<link rel="icon" href="/directr2/constants/favicon.ico" sizes="any" /> 

		<!-- Apple Touch Icon (references public/apple-touch-icon.png -> R2 constants/apple-touch-icon.png) -->
		<link rel="apple-touch-icon" href="/directr2/constants/apple-touch-icon.png" />

		<!-- Web Manifest (references public/site.webmanifest -> R2 constants/site.webmanifest) -->
		<link rel="manifest" href="/directr2/constants/site.webmanifest" /> 
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="height: 100%">%sveltekit.body%</div>
	</body>
</html>
